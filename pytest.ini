[pytest]
# 测试路径
testpaths = tests

# 测试文件匹配
python_files = test_*.py *_test.py

# 测试类匹配
python_classes = Test*

# 测试函数匹配
python_functions = test_*

# 插件配置
addopts = 
    -v
    --strict-markers
    --tb=short
    --showlocals
    --color=yes

# 覆盖率配置（pytest-cov）
addopts += 
    --cov=core
    --cov=modules
    --cov-report=term-missing
    --cov-report=html:reports/coverage
    --cov-report=xml:reports/coverage.xml

# 标记定义
markers =
    slow: 标记慢速测试（使用 -m "not slow" 跳过）
    integration: 集成测试（需要外部服务）
    unit: 单元测试
    e2e: 端到端测试
    api: API 测试
    yijing: 易经相关测试
    memory: 记忆系统测试
    retrieval: 检索相关测试
    policy: 权限策略测试
    benchmark: 性能基准测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %H:%M:%S

# 失败时停止
maxfail = 5

# 告警即错误
# warnings_error = true

# 忽略的警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
