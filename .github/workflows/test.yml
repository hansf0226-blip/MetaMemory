name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff black
          ruff check . --output-format=github-actions --exit-non-zero-on-fix
          black --check .

      - name: Test
        run: |
          pip install pytest pytest-asyncio
          python -m pytest tests/ -v --tb=short -x || true
