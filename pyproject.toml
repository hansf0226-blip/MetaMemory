[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metamemory"
version = "2.1.0"
description = "AI Agent 长期记忆系统 — 基于易经编码的语义检索与生命周期管理"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MetaMemory Team"}
]
keywords = ["ai", "memory", "agent", "retrieval", "embedding", "yijing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "numpy>=1.26.0,<2.0.0",
    "apscheduler>=3.10.0",
    "jieba>=0.42.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1.0"]
openai = ["openai>=1.0.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
]
all = ["metamemory[mysql,openai,dev]"]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/meta-memory"
Documentation = "https://github.com/YOUR_USERNAME/meta-memory#readme"
Issues = "https://github.com/YOUR_USERNAME/meta-memory/issues"
Changelog = "https://github.com/YOUR_USERNAME/meta-memory/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: unit tests",
    "integration: integration tests requiring external services",
    "api: API endpoint tests",
    "yijing: yijing encoding tests",
    "memory: memory system tests",
    "retrieval: retrieval engine tests",
    "policy: identity policy tests",
]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 110

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
